<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Agent · The Scent Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --ink: #1a1a1a;
    --bone: #f5f1ea;
    --paper: #faf8f4;
    --gold: #c9a961;
    --gold-bright: #e4c97a;
    --gold-dim: #8a7440;
    --line: rgba(201, 169, 97, 0.18);
    --muted: rgba(245, 241, 234, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--bone);
    font-family: 'Inter Tight', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201, 169, 97, 0.06), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(201, 169, 97, 0.04), transparent 50%);
  }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 48px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 48px;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .header-meta {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .header-meta .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--bone);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-bottom: 56px;
  }

  .stat {
    border: 1px solid var(--line);
    padding: 28px 24px;
    position: relative;
    background: rgba(255, 255, 255, 0.015);
  }

  .stat::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 44px;
    font-weight: 400;
    line-height: 1;
    color: var(--bone);
  }

  .stat-value .unit {
    font-size: 18px;
    color: var(--gold);
    margin-left: 4px;
  }

  .stat-sub {
    margin-top: 12px;
    font-size: 12px;
    color: var(--gold-dim);
    letter-spacing: 0.05em;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 14px 16px;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    font-weight: 500;
  }

  td {
    padding: 18px 16px;
    border-bottom: 1px solid rgba(201, 169, 97, 0.08);
    vertical-align: top;
  }

  tr:hover td {
    background: rgba(201, 169, 97, 0.03);
  }

  .trigger-tag {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
  }

  .subject {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--bone);
    max-width: 320px;
  }

  .converted {
    color: #4ade80;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .pending {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .empty {
    padding: 80px 24px;
    text-align: center;
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
  }

  @media (max-width: 900px) {
    .wrap { padding: 32px 20px; }
    h1 { font-size: 36px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    header { flex-direction: column; align-items: flex-start; gap: 20px; }
    .header-meta { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">The Scent Vault · Recovery Agent</div>
      <h1>Quiet <em>persuasion,</em><br>at scale.</h1>
    </div>
    <div class="header-meta">
      <div class="status"><span class="dot"></span> Agent active</div>
      <div style="margin-top: 8px;" id="last-update">Loading...</div>
    </div>
  </header>

  <div class="grid">
    <div class="stat">
      <div class="stat-label">Emails Personalized</div>
      <div class="stat-value" id="stat-emails">·</div>
      <div class="stat-sub">Past 7 days</div>
    </div>
    <div class="stat">
      <div class="stat-label">Conversions</div>
      <div class="stat-value" id="stat-conversions">·</div>
      <div class="stat-sub" id="stat-conv-rate">·</div>
    </div>
    <div class="stat">
      <div class="stat-label">Revenue Recovered</div>
      <div class="stat-value" id="stat-revenue">·</div>
      <div class="stat-sub" id="stat-aov">·</div>
    </div>
    <div class="stat">
      <div class="stat-label">Return on Spend</div>
      <div class="stat-value" id="stat-roi">·</div>
      <div class="stat-sub" id="stat-cost">·</div>
    </div>
  </div>

  <div class="section-title">Recent Activity</div>
  <table>
    <thead>
      <tr>
        <th style="width: 130px;">When</th>
        <th style="width: 140px;">Trigger</th>
        <th>Subject Generated</th>
        <th>Product</th>
        <th style="width: 120px;">Outcome</th>
      </tr>
    </thead>
    <tbody id="activity-rows">
      <tr><td colspan="5" class="empty">Loading recent activity...</td></tr>
    </tbody>
  </table>
</div>

<script>
const TOKEN = localStorage.getItem('dashboard_token') || prompt('Dashboard token:');
if (TOKEN) localStorage.setItem('dashboard_token', TOKEN);

async function load() {
  try {
    const res = await fetch('/api/stats?days=7', {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    if (!res.ok) throw new Error('Auth failed');
    const { stats, recent } = await res.json();
    render(stats, recent);
  } catch (err) {
    document.getElementById('activity-rows').innerHTML =
      `<tr><td colspan="5" class="empty">Could not load: ${err.message}</td></tr>`;
  }
}

function render(stats, recent) {
  document.getElementById('stat-emails').innerHTML = stats.total_emails;
  document.getElementById('stat-conversions').innerHTML = stats.conversions;
  document.getElementById('stat-conv-rate').textContent =
    `${(stats.conversion_rate * 100).toFixed(1)}% conversion rate`;
  document.getElementById('stat-revenue').innerHTML =
    `<span class="unit">$</span>${stats.revenue_recovered.toFixed(0)}`;
  const aov = stats.conversions ? stats.revenue_recovered / stats.conversions : 0;
  document.getElementById('stat-aov').textContent = `$${aov.toFixed(0)} average order`;
  document.getElementById('stat-roi').innerHTML =
    `${stats.roi.toFixed(0)}<span class="unit">×</span>`;
  document.getElementById('stat-cost').textContent = `$${stats.api_cost.toFixed(2)} spent`;
  document.getElementById('last-update').textContent =
    `Updated ${new Date().toLocaleTimeString()}`;

  const rows = recent.map(r => `
    <tr>
      <td style="color: var(--muted); font-size: 12px;">${timeAgo(r.created_at)}</td>
      <td><span class="trigger-tag">${triggerLabel(r.trigger_type)}</span></td>
      <td><div class="subject">${escape(r.generated_subject || '')}</div></td>
      <td style="color: var(--muted); font-size: 12px;">${escape((r.products || [])[0] || '')}</td>
      <td>${r.converted_at
        ? `<span class="converted">✦ $${Number(r.conversion_value).toFixed(0)}</span>`
        : `<span class="pending">Pending</span>`}</td>
    </tr>
  `).join('');

  document.getElementById('activity-rows').innerHTML = rows ||
    `<tr><td colspan="5" class="empty">No activity yet. The agent is waiting for the first webhook.</td></tr>`;
}

function triggerLabel(t) {
  return ({
    abandoned_cart: 'Cart',
    browse_abandonment: 'Browse',
    post_popup_no_purchase: 'Popup'
  })[t] || t;
}

function timeAgo(iso) {
  const seconds = (Date.now() - new Date(iso)) / 1000;
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

function escape(s) {
  return String(s).replace(/[<>&"]/g, c =>
    ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
